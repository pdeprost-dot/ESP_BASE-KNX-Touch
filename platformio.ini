[platformio]
default_envs = waveshare_esp32_s3_touch_lcd_1_47

[env:waveshare_esp32_s3_touch_lcd_1_47]
platform = espressif32
board = waveshare_esp32_s3_touch_lcd_1_47
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
build_unflags =
  -std=gnu++11
lib_deps =
  https://github.com/pdeprost-dot/ESP_BASE.git#esp-base-2.4.1
  knolleary/PubSubClient@2.8
  moononournation/GFX Library for Arduino@1.5.9

[env:espbase_230_reference]
extends = env:waveshare_esp32_s3_touch_lcd_1_47
lib_deps =
  https://github.com/pdeprost-dot/ESP_BASE.git#esp-base-2.3.0
  knolleary/PubSubClient@2.8

